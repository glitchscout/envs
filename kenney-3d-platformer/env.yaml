# Kenney Starter Kit 3D Platformer: a small, stable 3D baseline (character controller, double jump, coins,
# falling platforms, camera), fast to build and close to deterministic, for per-PR E2E smoke runs.
name: kenney-3d-platformer
upstream: https://github.com/KenneyNL/Starter-Kit-3D-Platformer
pin: 3fa8a04b1c01ab23db43123d4ce814a34c3fc7f0 # "Upgrade to Godot 4.6"
canary: main
engine: { name: godot, version: "4.7.2" }
sdk: { repo: https://github.com/glitchscout/godot-sdk, ref: aeb882038b0fc4b2459ac8c22728ef61b598c208, path: addons/glitchscout }
license_notes: "MIT code, CC0 assets (sprites, models, sounds). We distribute patches only."
patches: [patches/0001-glitchscout-qa.patch]
# Godot runs the project directly (no export templates needed): the build is the patched project with its
# import cache. The Godot binary must be on PATH as godot.
build:
  linux: &build mkdir -p build && tar --exclude=./build --exclude=./.git -cf - . | tar -xf - -C build && godot --headless --path build --import
  darwin: *build
  windows: *build
launch: "godot --path {build} --headless --fixed-fps 60 --audio-driver Dummy -- --glitchscout-endpoint={endpoint} --glitchscout-token={token}"
