# Game-specific steps (declarative, no code).
# A tap is a press that releases itself.
- step: the player taps {action}
  kind: when
  compiles_to: { scripted: [ { press: { action: "{action}", hold_ticks: 2 } } ] }
# Distance on the ground (x and z), squared to stay within what an oracle expression can compute.
- step: the player should be more than {float} m from {float}, {float} within {float} second(s)
  kind: then
  compiles_to:
    oracle:
      expr: "(player.position.x - {float:2}) * (player.position.x - {float:2}) + (player.position.z - {float:3}) * (player.position.z - {float:3}) > {float:1} * {float:1}"
    within_s: "{float:4}"
