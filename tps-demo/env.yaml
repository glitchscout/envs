# Godot TPS demo: a high-fidelity 3D third-person shooter (enemy robots, aiming, physics debris, heavy lighting),
# maintained by the Godot project. Nightly only: its repository is large and it is here to stress rendering, perf and
# vision, not to gate pull requests.
name: tps-demo
upstream: https://github.com/godotengine/tps-demo
pin: a82f15448e9b015440d3bbdf5e10801b260c4e9f # "Update to Godot 4.7.2"
canary: master
engine: { name: godot, version: "4.7.2" }
sdk: { repo: https://github.com/glitchscout/godot-sdk, ref: af7257310f6d725c31a7da645984a5df03c260f8, path: addons/glitchscout }
license_notes: "MIT code; CC-BY 3.0 assets and music (see the upstream LICENSE.md). We distribute patches only."
patches: [patches/0001-glitchscout-qa.patch]
# Godot runs the project directly (no export templates needed). The Godot binary must be on PATH as godot.
build:
  linux: &build mkdir -p qa-build && tar --exclude=./qa-build --exclude=./.git -cf - . | tar -xf - -C qa-build && godot --headless --path qa-build --import
  darwin: *build
  windows: *build
output: qa-build
# Rendered, since rendering is what this env stresses, and with a GPU: software GL draws this level at a few frames a
# second, too slow for a run. The Compatibility renderer, since the game's own Forward+ needs Vulkan or Metal.
launch: "godot --path {build} --rendering-method gl_compatibility --rendering-driver opengl3 --windowed --resolution 960x540 --fixed-fps 60 --audio-driver Dummy -- --glitchscout-endpoint={endpoint} --glitchscout-token={token}"
