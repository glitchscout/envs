# Threadbare: the primary Godot environment, a 2D action-adventure in active development (dialogue, puzzles, quests,
# a scene switcher). It is the gating env for real churn; Kenney stays the small per-PR smoke.
name: threadbare
upstream: https://github.com/endlessm/threadbare
# Upstream keeps its assets in Git LFS, and repeated CI clones would spend its bandwidth quota, so builds clone a
# private mirror holding the pinned commit's objects. See README.md.
mirror: https://github.com/glitchscout/threadbare-qa.git
pin: c6f1f60bf3b6e9a204b353ad1f77fe9a31642988 # v0.2.4
canary: main
engine: { name: godot, version: "4.7.2" }
sdk: { repo: https://github.com/glitchscout/godot-sdk, ref: 947460d0074e75865d971e737ee6b35ae2340fff, path: addons/glitchscout }
license_notes: "MPL-2.0 code, CC BY-SA 4.0 assets. We distribute patches only, never the game's assets."
patches: [patches/0001-glitchscout-qa.patch]
# Godot runs the project directly (no export templates needed). Upstream tracks its own build/ directory, so ours is
# qa-build. The Godot binary must be on PATH as godot.
build:
  linux: &build mkdir -p qa-build && tar --exclude=./qa-build --exclude=./.git -cf - . | tar -xf - -C qa-build && godot --headless --path qa-build --import
  darwin: *build
  windows: *build
output: qa-build
launch: "godot --path {build} --headless --fixed-fps 60 --audio-driver Dummy -- --glitchscout-endpoint={endpoint} --glitchscout-token={token}"
